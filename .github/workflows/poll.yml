name: Poll pickleball sessions

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: poll-pickleball
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      # Pinned explicitly: this must always run against main (where GitHub
      # Pages deploys from) regardless of whatever the repo's default
      # branch happens to be set to -- a schedule/workflow_dispatch run
      # otherwise checks out the default branch, which drifted out of sync
      # with main before and silently left the live site on stale data.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Stage previous snapshot for diffing
        run: |
          if [ -f data/sessions.json ]; then
            cp data/sessions.json data/sessions.prev.json
          fi

      - name: Scrape current sessions
        run: python scraper/scrape.py

      - name: Send notifications for new/opened sessions
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scraper/notify.py

      - name: Publish data for the GitHub Pages site
        run: cp data/sessions.json docs/sessions.json

      - name: Commit updated data if changed
        run: |
          rm -f data/sessions.prev.json
          git config user.name "pickleball-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sessions.json data/debug_capture.json docs/sessions.json
          if ! git diff --cached --quiet; then
            git commit -m "Update scraped session data"
            git push
          else
            echo "No changes to commit."
          fi
